# Monthly dependency-update PRs for the bot (/) and the dashboard (/web). Monthly, not weekly: this is a
# single-owner project, and the scheduled CI run (.github/workflows/test.yml) catches breakage in between.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
