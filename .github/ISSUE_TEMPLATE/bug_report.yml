name: Bug report
description: Something in Talaash does not work as the docs say.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please leave out anything personal: your CV, name, contact details, API keys and the contents of `.env`, `config.json` or `cv/`. For a security problem, use **Security → Report a vulnerability** instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. npm run bot -- fetch
        2. ...
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Error output
      description: The command's output or the dashboard's error, with personal details removed.
      render: text
  - type: textarea
    id: doctor
    attributes:
      label: "`npm run bot -- doctor` output"
      description: It checks the whole setup. Remove personal details first.
      render: text
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Linux, Windows, Docker]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Talaash version or commit
      description: "`git log -1 --format=%h` in your Talaash folder."
